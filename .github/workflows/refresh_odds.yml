name: Refresh PMU odds

# Le marché est notre prédicteur, mais il ne devient bon qu'à l'approche du
# départ : 37,6 % de gagnants trouvés avec la cote de départ contre 31,0 % avec
# une cote de 6 à 12 h (banc scripts/evaluate-freshness.mjs).
#
# L'import complet ne passe que trois fois par jour et publiait deux tiers des
# courses avec des cotes de plus de deux heures. Ce workflow ne fait que
# rafraîchir les cotes des courses au départ dans les 90 minutes — quelques
# secondes de calcul, aucune écriture de programme.

on:
  workflow_dispatch:
    inputs:
      window:
        description: "Fenêtre en minutes avant le départ"
        required: false
        default: "45"
        type: string
  schedule:
    # Toutes les 30 minutes de 07:00 à 21:00 UTC, soit 09:00-23:00 à Paris en
    # été : la plage couvre les réunions de la mi-journée jusqu'aux nocturnes.
    # Le dépôt est public, les minutes Actions sont gratuites — la seule raison
    # de ne pas resserrer davantage serait de ménager l'API PMU, qu'on
    # n'interroge que pour les courses au départ dans les 45 minutes.
    - cron: "5,35 7-21 * * *"
    # Créneau tardif pour l'heure d'hiver : le cron est en UTC, et de fin
    # octobre à fin mars Paris n'est qu'à UTC+1. Sans lui, le dernier passage
    # (21:35 UTC = 22:35 Paris) manquait les dernières courses des nocturnes de
    # Vincennes, qui partent jusqu'à 22:30-23:00 Paris. En été ces deux passages
    # ne trouvent aucune course dans la fenêtre et se terminent aussitôt.
    - cron: "5,35 22 * * *"

# Le job n'écrit rien dans le dépôt : lecture seule suffit.
permissions:
  contents: read

# Un passage en retard ne doit pas s'empiler sur le suivant : la donnée fraîche
# prime toujours sur la donnée en attente.
concurrency:
  group: refresh-odds
  cancel-in-progress: true

jobs:
  refresh-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # L'entrée passe par l'environnement, jamais interpolée dans `run:` :
      # `${{ inputs.window }}` dans un script shell est une injection de commande.
      ODDS_WINDOW: ${{ inputs.window || '45' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh odds for imminent races
        timeout-minutes: 10
        run: npm run data:refresh:odds -- --window "$ODDS_WINDOW"
