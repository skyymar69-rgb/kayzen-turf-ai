name: Live refresh

# Cotes, parts des enjeux et pronostics gelés des courses imminentes.
#
# GitHub ne garantit pas l'heure des déclenchements planifiés : 8 passages réels
# sur 60 prévus du 30/09 au 02/10/2026, puis 5 sur 32 le 03/10 avec des écarts
# de 4 à 9 heures. Des boucles de trois heures laissaient donc 40 % des courses
# partir sans cote fraîche.
#
# Chaque job lance une boucle de 5 h 30 (scripts/live-refresh.ts), puis relance
# lui-même le passage suivant par workflow_dispatch : la chaîne tourne en continu
# sans dépendre du planificateur. Le cron n'est plus qu'un filet pour la
# redémarrer si un runner disparaît en cours de route.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée de la boucle en minutes"
        required: false
        default: "330"
        type: string
  schedule:
    - cron: "3 */2 * * *"

permissions:
  contents: read
  actions: write # relance du passage suivant

# Un seul passage à la fois. Un déclenchement qui arrive pendant une boucle
# attend son tour au lieu de l'interrompre ; GitHub ne garde qu'un passage en
# attente, la chaîne ne peut donc pas se dédoubler.
concurrency:
  group: live-refresh
  cancel-in-progress: false

jobs:
  live-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Clé privée des alertes push (src/lib/push/send.ts).
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      # Entrée passée par l'environnement, jamais interpolée dans `run:`.
      LOOP_MINUTES: ${{ inputs.minutes || '330' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh imminent races
        timeout-minutes: 340
        run: npx tsx scripts/live-refresh.ts --minutes "$LOOP_MINUTES"

      - name: Relaunch next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          # Après un échec, on attend avant de relancer pour ne pas enchaîner
          # des passages ratés à la minute.
          if [ "$OUTCOME" != "success" ]; then sleep 300; fi
          gh workflow run live_refresh.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
