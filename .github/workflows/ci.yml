name: CI

# Vérification de chaque poussée : types, lint, tests, build de production.
# Vercel construit aussi, mais sans lint ni tests : une régression de logique
# partait en production sans signal.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Sans DATABASE_URL, le build rend le mode démonstration : il vérifie que
      # toutes les pages compilent et se pré-rendent, sans toucher à la base.
      - name: Build
        run: npm run build

  # Parcours de bout en bout et audit d'accessibilité (Playwright + axe-core),
  # dans une tâche à part : un échec e2e se lit séparément d'une régression de
  # types ou de tests unitaires, et ne retarde pas leur signal. Lancée une fois
  # `verify` passé — inutile de démarrer un navigateur sur un build cassé.
  # Le build est refait ici (runner neuf), en mode démonstration, sans base.
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts construit puis démarre le serveur de production
      # (port 3100) ; CI=true active la reprise unique et le rapport GitHub.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
