name: Track record

# Suivi de performance quotidien : complète les rapports officiels PMU manquants,
# puis recalcule le backtest et le suivi en direct (pronostics gelés), publiés
# sur /track-record. Voir scripts/backtest.ts.

on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"

permissions:
  contents: read

# Lecture seule de la base, hormis une ligne de rapport : peut tourner pendant
# un import, mais jamais en double.
concurrency:
  group: track-record
  cancel-in-progress: false

jobs:
  track-record:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
        # Les secrets de la base ne sont pas exposés aux scripts d'installation
        # des quelque 500 dépendances : une seule compromise suffirait sinon à
        # exfiltrer l'accès complet à la base.
        env:
          DATABASE_URL: ""

      - name: Complete missing official payouts
        timeout-minutes: 15
        # Borné : un rattrapage massif (première exécution, panne PMU) se fait
        # en plusieurs nuits plutôt que de dépasser le délai de l'étape.
        run: node scripts/backfill-payouts.mjs --from 2026-04-01 --limit 400

      - name: Backtest and live tracking
        # Les tickets du site sont reconstitués course par course avec le code
        # de production (environ 25 ms par course) : quelques minutes de plus.
        timeout-minutes: 30
        run: npx tsx scripts/backtest.ts
