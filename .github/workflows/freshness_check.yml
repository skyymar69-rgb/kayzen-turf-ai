name: Freshness check

# Alerte quotidienne : échoue (et GitHub envoie son courriel d'échec) si plus
# de 10 % des courses de la veille sont parties sans relevé de cote ni de pool
# dans les 20 minutes précédant le départ. Voir scripts/check-freshness.mjs.
#
# Le contrôle porte sur la veille (heure de Paris), passé minuit : l'ancienne
# version vérifiait « aujourd'hui » à 3 h du matin, donc zéro course, et restait
# verte alors que 40 % des départs du 02/10 manquaient de cote fraîche.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check odds freshness for yesterday's races
        run: node scripts/check-freshness.mjs --date "$(TZ=Europe/Paris date -d yesterday +%F)"
