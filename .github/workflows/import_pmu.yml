name: Import PMU programme

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional PMU date in DDMMYYYY format"
        required: false
        type: string
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 10 * * *"
    - cron: "30 17 * * *"

# Le job n'écrit rien dans le dépôt : lecture seule suffit.
permissions:
  contents: read

# Même groupe que compact_storage.yml : la compaction fait un VACUUM FULL et
# retire temporairement un index, l'import ne doit jamais tourner en même temps.
# Pas de cancel-in-progress : un import en cours va jusqu'au bout.
concurrency:
  group: pmu-database

jobs:
  import-pmu:
    runs-on: ubuntu-latest
    # Le job dure normalement 21-31 min (import 13-19 min + apprentissage 8-11 min).
    # L'ancienne limite de 30 min tuait l'étape "Learn from official results" environ
    # une exécution sur deux. Marge portée à 90 min ; les garde-fous anti-blocage
    # réels sont désormais posés par étape ci-dessous.
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # L'entrée passe par l'environnement, jamais interpolée dans `run:` :
      # `${{ inputs.date }}` dans un script shell est une injection de commande.
      PMU_DATE: ${{ inputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npm run db:schema

      - name: Import requested PMU date
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.date != '' }}
        timeout-minutes: 45
        run: npm run data:import:pmu -- --date "$PMU_DATE"

      - name: Import rolling PMU window
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.date == '' }}
        timeout-minutes: 45
        run: npm run data:import:pmu

      - name: Prune races outside France/Equidia scope
        timeout-minutes: 10
        run: npm run data:prune:scope

      - name: Learn from official results
        timeout-minutes: 30
        run: npm run model:learn
